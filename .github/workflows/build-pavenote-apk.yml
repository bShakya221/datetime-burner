name: Build PaveNote APK

on:
  push:
    branches: [feature/pavenote-android]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and assemble
        id: gradle_build
        working-directory: pavenote-android
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaveNote-build-log
          path: build.log
          if-no-files-found: error

      - name: Verify no INTERNET permission
        run: |
          ! grep -R "android.permission.INTERNET" pavenote-android/app/src/main/AndroidManifest.xml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaveNote-0.1-debug
          path: pavenote-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
