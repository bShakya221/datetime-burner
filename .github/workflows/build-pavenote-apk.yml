name: Build PaveNote APK

on:
  push:
    branches: [feature/pavenote-android]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android source bundle
        run: |
          base64 -d pavenote-android.tar.gz.b64 > /tmp/pavenote.tar.gz
          tar -xzf /tmp/pavenote.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and assemble
        working-directory: pavenote-android
        run: gradle testDebugUnitTest lintDebug assembleDebug

      - name: Verify no INTERNET permission
        run: |
          ! grep -R "android.permission.INTERNET" pavenote-android/app/src/main/AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: PaveNote-0.1-debug
          path: pavenote-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
